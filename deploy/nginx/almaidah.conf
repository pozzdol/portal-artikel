# ALMAIDAH reverse proxy (Nginx). Copy to /etc/nginx/sites-available/almaidah.conf,
# symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Replace example.com with the real production domain everywhere below.
# TLS cert paths assume certbot (`certbot --nginx -d example.com`), which will
# rewrite this file's TLS block automatically on first run — the server{}
# skeleton below is a starting point, not the final certbot output.

# HTTP: only used for the ACME challenge and to redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Optional: HSTS at the proxy (only once TLS is confirmed stable; the app
    # also sends this header itself when NEXT_PUBLIC_SITE_URL is https://).
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Uploaded article/media covers, favicons, etc. 5 MB is the app's own
    # limit (UPLOAD_MAX_MB); +1 MB of headroom for multipart overhead.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # Next.js build output is content-hashed and safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional alternative: serve uploaded files directly from disk instead of
    # proxying them through Next (skips one hop for large images). Requires
    # the Nginx worker user to have read access to backend/uploads.
    # location /uploads/ {
    #     alias /opt/portal-berita/backend/uploads/;
    #     add_header Cache-Control "public, max-age=604800";
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # IMPORTANT: overwrite (not append) X-Forwarded-For so the backend's
        # TRUSTED_PROXIES-based RealIP middleware always sees the true client
        # as the rightmost entry, never a client-spoofed value (docs/deploy.md
        # "Trusted proxies").
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket upgrade support (Next.js HMR is dev-only, but harmless to
        # keep here in case a future feature needs it).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }
}

# Required for the "Connection $connection_upgrade" header above; put this
# once at the http{} level of nginx.conf (not inside this server block):
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
